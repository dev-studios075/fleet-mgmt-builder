name: Public Android App Builder

on:
  repository_dispatch:
    types: [build-and-upload-app]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag) to build"
        required: true
        default: "main"
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-upload:
    name: Build & Upload Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout public builder repo
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26.*
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc
          echo "Disk usage after cleanup:"
          df -h /

      - name: Clone private app repository
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dev-studios075/fleetcodes-onboard-app.git app-repo
          cd app-repo
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            REF="${{ github.event.client_payload.ref }}"
          else
            REF="${{ github.event.inputs.ref }}"
          fi
          echo "Checking out ref: $REF"
          git checkout "$REF"
          echo "Building commit: $(git rev-parse HEAD)"

      - name: Determine Environment Settings
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            ENV_ARG="${{ github.event.client_payload.environment }}"
          else
            ENV_ARG="${{ github.event.inputs.environment }}"
          fi
          if [ -z "$ENV_ARG" ]; then
            ENV_ARG="dev"
          fi
          echo "env_arg=$ENV_ARG" >> $GITHUB_OUTPUT
          echo "Building for environment: $ENV_ARG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./app-repo/package-lock.json"

      - name: Install Node Dependencies
        working-directory: ./app-repo
        run: npm ci

      - name: Type Check (TypeScript)
        working-directory: ./app-repo
        run: npx tsc --noEmit

      - name: Generate .env File
        working-directory: ./app-repo
        env:
          EXPO_PUBLIC_BASE_API_URL: ${{ secrets.EXPO_PUBLIC_BASE_API_URL }}
          EXPO_PUBLIC_PUSHER_BEAMS_INSTANCE_ID: ${{ secrets.EXPO_PUBLIC_PUSHER_BEAMS_INSTANCE_ID }}
          EXPO_PUBLIC_BUNDLE_IDENTIFIER: ${{ secrets.EXPO_PUBLIC_BUNDLE_IDENTIFIER }}
        run: |
          echo "EXPO_PUBLIC_BASE_API_URL=${EXPO_PUBLIC_BASE_API_URL}" > .env
          echo "EXPO_PUBLIC_PUSHER_BEAMS_INSTANCE_ID=${EXPO_PUBLIC_PUSHER_BEAMS_INSTANCE_ID}" >> .env
          echo "EXPO_PUBLIC_BUNDLE_IDENTIFIER=${EXPO_PUBLIC_BUNDLE_IDENTIFIER}" >> .env
          echo ".env file generated successfully."

      - name: Sync App Version
        working-directory: ./app-repo
        run: node scripts/sync-version.js

      - name: Expo Prebuild (Generate Android Folder)
        working-directory: ./app-repo
        run: npx expo prebuild --platform android --clean

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: ndk-v2-27.1.12297006-${{ runner.os }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != "true"
        env:
          ANDROID_NDK_VERSION: 27.1.12297006
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ]; then
            echo "Android NDK ${ANDROID_NDK_VERSION} is already available."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing Android NDK ${ANDROID_NDK_VERSION} (attempt ${attempt})"
            if "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}"; then
              test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
              exit 0
            fi
            rm -rf "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" "${ANDROID_HOME}/.temp"
            sleep 10
          done
          echo "Failed to install Android NDK ${ANDROID_NDK_VERSION}" >&2
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Android Release APK
        id: build-apk
        working-directory: ./app-repo/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          NODE_ENV: production
        run: |
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.enablePngCrunchInReleaseBuilds=false" >> gradle.properties
          ./gradlew assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.parallel=false -x lintVitalRelease -x lintVitalAnalyzeRelease
          echo "Gradle compilation complete."

      - name: Upload APK to S3
        working-directory: ./app-repo
        env:
          DEV_UPLOAD_API_URL: ${{ secrets.DEV_UPLOAD_API_URL }}
          PROD_UPLOAD_API_URL: ${{ secrets.PROD_UPLOAD_API_URL }}
        run: |
          node scripts/upload-apk.js ${{ steps.set-env.outputs.env_arg }}

      - name: Publish App Release Metadata
        if: env.APP_RELEASE_PUBLISH_TOKEN != ""
        working-directory: ./app-repo
        env:
          APP_RELEASE_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_API_URL }}
          APP_RELEASE_PUBLISH_TOKEN: ${{ secrets.APP_RELEASE_PUBLISH_TOKEN }}
          APP_APK_PUBLIC_BASE_URL: ${{ secrets.APP_APK_PUBLIC_BASE_URL }}
        run: |
          node scripts/publish-app-release.js ${{ steps.set-env.outputs.env_arg }}

      - name: Upload APK as Artifact
        if: always() && steps.build-apk.outcome == "success"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.set-env.outputs.env_arg }}.apk
          path: app-repo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          rm -rf app-repo
          git credential-cache exit || true
          git config --global --unset credential.helper || true
